spring:
  application:
    name: aperture

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aperture_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: Aperture
    description: Architecture intelligence platform for Java and Spring Boot systems
    version: 0.0.1-SNAPSHOT

aperture:
  storage:
    root: ${APERTURE_STORAGE_ROOT:storage}
  quality-gate:
    minimum-score: 80
    max-critical-issues: 0
    max-high-issues: 5
  rules:
    disabled: []
    severity-overrides: {}
