services:
  postgres:
    image: postgres:18
    container_name: aperture-postgres
    environment:
      POSTGRES_DB: aperture_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - aperture-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aperture_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aperture-postgres-data:
